[project]
name = "refire"
version = "0.1.0"
description = "Automated long-form video editor — Stage 1: segment detection"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    # ctranslate2 ships cuDNN but not cuBLAS; transcribe._register_cuda_dlls puts
    # this wheel's bin/ on the DLL search path so CUDA transcription can load.
    "nvidia-cublas-cu12>=12.4",
    "ollama>=0.3",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
refire = "refire.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"refire" = "refire"}
packages = ["refire"]
